name: release
# Pushing a tag like 1.4.0 (the same number as "version" in package.json) builds the macOS app and attaches the .dmg to a GitHub Release.
# The app's Settings → General → Updates looks at the latest release of this repository.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: pnpm build
      # A stable self-signed certificate (secrets MAC_SIGN_P12 base64 + MAC_SIGN_PASSWORD) keeps the Keychain from asking after every update
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.MAC_SIGN_P12 }}
          PASS: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          test -n "$P12" || { echo "MAC_SIGN_P12 is not set"; exit 1; }
          KC="$RUNNER_TEMP/sign.keychain-db"; KP="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" > /dev/null
          rm "$RUNNER_TEMP/sign.p12"
          echo "MAC_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "MAC_SIGN_IDENTITY=Artemis Self-Signed" >> "$GITHUB_ENV"
      - run: pnpm exec electron-builder --mac --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true
